name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: release ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f548e57e544e1ff5a4c46bf1e1b8685f8e4a348a
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@ae0d4ed08881f17d1511386f5be3e62356acd4a6
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: package.json
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test:unit
      - run: pnpm smoke:cli
      - run: pnpm smoke:extension
      - run: pnpm smoke:package
      - name: Package artifacts
        run: |
          pnpm pack --pack-destination dist-release
          (cd spec-kit/extension && zip -r ../../dist-release/ackit-extension-${{ github.ref_name }}.zip . -x "*.git*")
          (cd spec-kit/workflow && zip -r ../../dist-release/ackit-workflow-${{ github.ref_name }}.zip . -x "*.git*")
          (cd dist-release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish GitHub Release
        # softprops/action-gh-release@v2 (3bb12739c298aeb8a4eeaf626c5b8d85266b0e65)
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            dist-release/*
          generate_release_notes: true
