schema_version: "1.0"
workflow:
  id: "ackit-verified-sdd"
  name: "ACKit-Verified SDD"
  version: "0.1.1"
  author: "Cynrath"
  description: "Spec Kit SDD cycle with ACKit sync, verification, and gated completion"
requires:
  speckit_version: ">=1.0.0"
  integrations:
    any:
      - "claude"
      - "copilot"
      - "gemini"
      - "codex"
      - "generic"
inputs:
  spec:
    type: string
    required: true
    prompt: "Describe what you want to build"
  integration:
    type: string
    default: "auto"
    prompt: "Integration to use ('auto' uses the project's initialized integration)"
steps:
  - id: specify
    command: speckit.specify
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
  - id: ackit-sync-spec
    command: speckit.ackit.sync
    integration: "{{ inputs.integration }}"
    input:
      args: ""
  - id: review-spec
    type: gate
    message: "Review the generated spec before planning."
    options: [approve, reject]
    on_reject: abort
  - id: plan
    command: speckit.plan
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
  - id: ackit-sync-plan
    command: speckit.ackit.sync
    integration: "{{ inputs.integration }}"
    input:
      args: ""
  - id: review-plan
    type: gate
    message: "Review the plan before generating tasks."
    options: [approve, reject]
    on_reject: abort
  - id: tasks
    command: speckit.tasks
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
  - id: ackit-sync-tasks
    command: speckit.ackit.sync
    integration: "{{ inputs.integration }}"
    input:
      args: ""
  - id: implement
    command: speckit.implement
    integration: "{{ inputs.integration }}"
    input:
      args: "{{ inputs.spec }}"
  - id: ackit-verify
    command: speckit.ackit.verify
    integration: "{{ inputs.integration }}"
    input:
      args: "--profile standard"
  - id: ackit-gate
    command: speckit.ackit.gate
    integration: "{{ inputs.integration }}"
    input:
      args: ""
