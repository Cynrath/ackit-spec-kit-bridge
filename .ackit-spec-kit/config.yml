# ACKit Spec Kit Bridge configuration.
schemaVersion: 1

ackit:
  command: ackit
  minVersion: 0.5.0

specKit:
  command: specify
  minVersion: 1.0.0

mapping:
  mode: active-feature

verification:
  defaultProfile: standard
  stalePolicy: fail

profiles:
  quick: {}
  standard: {}
  high-risk: {}

evidence:
  redact: true
